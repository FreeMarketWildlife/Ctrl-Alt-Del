<title id="title">Ctrl Alt Del desktop level editor workspace proposal</title>
<desc id="desc">Annotated desktop wireframe with asset browser at left, native scene in the center, hierarchy and inspector at right, and mission steps below. A noncanon street to alley demo illustrates placement and links. This is planning documentation, not an editor implementation or approved artwork.</desc>
